<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | 名刺風スタイル</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts: Orbitron (近未来・サイバー系) & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- メインカード（名刺風デザイン） -->
  <main class="business-card">

    <!-- 左エリア：ホワイトベース（プロフィール・スキル） -->
    <section class="card-left">
      <div class="profile-header">
        <span class="job-title">ゲームクリエイター</span>
        <h1 class="name-ja">太田 拓海</h1>
        <p class="name-en">ota takumi</p>
      </div>

      <div class="divider"></div>

      <div class="info-section">
        <div class="info-group">
          <span class="info-label">所属・代表</span>
          <p class="info-value">ゲーム制作サークル「Unuse」代表</p>
        </div>

        <div class="info-group">
          <span class="info-label">使用ツール・言語</span>
          <p class="info-value tech-stack">Unity / GitHub / Python / C#</p>
        </div>
      </div>
    </section>

    <!-- 右エリア：ディープブルーベース（ビジュアル・リンク） -->
    <section class="card-right">
      <div class="frame-border">
        
        <!-- プロフィール画像エリア -->
        <div class="avatar-wrapper">
          <!-- 実際のお写真画像のパスに差し替えてください -->
          <img src="https://via.placeholder.com/150" alt="プロフィール写真" class="avatar-img">
        </div>

        <!-- アカウント・リンクボタン群 -->
        <div class="link-grid">
          <a href="#" class="cyber-btn">
            <span class="btn-label">GitHub</span>
          </a>
          <a href="#" class="cyber-btn">
            <span class="btn-label">X (Twitter)</span>
          </a>
          <a href="#" class="cyber-btn">
            <span class="btn-label">サークル WEB</span>
          </a>
          <a href="#" class="cyber-btn">
            <span class="btn-label">サークル X</span>
          </a>
        </div>

        <!-- 好きなもの（右下デザイン要素） -->
        <div class="favorite-box">
          <div class="target-corner">
            <!-- 任意の画像やアイコン -->
            <span class="fav-icon">🪼</span>
          </div>
          <span class="fav-label">好きなもの</span>
        </div>

      </div>
    </section>

  </main>

</body>
</html>
